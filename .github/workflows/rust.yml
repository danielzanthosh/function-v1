name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # (Linux dependencies step removed since this is a macOS exclusive runner)

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Upload macOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: program-macos
          path: target/release/function
          if-no-files-found: error

name: macOS Build & Distribution

on:
  push:
    branches: ["main", "swift_main"]
  pull_request:
    branches: ["main", "swift_main"]
  workflow_dispatch:

env:
  APP_VERSION: "0.1.0"

jobs:
  build-macos:
    name: Build & Package macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Swift 6.2 toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.3"

      - name: Run Swift tests
        run: swift test

      - name: Build and package native SwiftUI app
        run: |
          bash scripts/package-macos.sh
          cp -R dist/Function.app Function.app
          plutil -lint Function.app/Contents/Info.plist
          test -f Function.app/Contents/Resources/icon.png
          file Function.app/Contents/MacOS/Function

      - name: Sign Function.app
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${APPLE_CERTIFICATE_P12_BASE64:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "Using Developer ID Application signing."

            KEYCHAIN_PATH="$RUNNER_TEMP/function-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            CERT_PATH="$RUNNER_TEMP/function-cert.p12"

            printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            security default-keychain -s "$KEYCHAIN_PATH"

            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
            if [ -z "$IDENTITY" ]; then
              echo "::error::No Developer ID Application identity was found in the imported certificate."
              exit 1
            fi

            echo "Signing identity: $IDENTITY"

            codesign --force --deep --options runtime --timestamp               --entitlements assets/macos/entitlements.plist               --sign "$IDENTITY" Function.app

            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          else
            echo "::warning::Apple signing secrets are not configured. Building an ad-hoc development artifact. It will NOT be Gatekeeper-trusted."
            codesign --force --deep --options runtime               --entitlements assets/macos/entitlements.plist               --sign - Function.app

            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

          codesign --verify --deep --strict --verbose=2 Function.app

      - name: Create professional DMG
        run: |
          set -euo pipefail

          rm -rf dmg-root Function.dmg
          mkdir -p dmg-root

          cp -R Function.app dmg-root/Function.app
          ln -s /Applications dmg-root/Applications

          # UDZO is a compressed, read-only distribution image suitable for downloads.
          hdiutil create             -volname "Function"             -srcfolder dmg-root             -ov             -format UDZO             -imagekey zlib-level=9             Function.dmg


      - name: Notarize and staple distribution
        if: env.SIGNED == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_API_KEY_ID:-}" ] || [ -z "${APPLE_API_ISSUER_ID:-}" ] || [ -z "${APPLE_API_KEY_P8_BASE64:-}" ]; then
            echo "::warning::Developer ID signing is configured, but Apple notarization secrets are missing. The app is signed but not notarized."
            exit 0
          fi

          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"

          xcrun notarytool submit Function.dmg             --key "$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"             --key-id "$APPLE_API_KEY_ID"             --issuer "$APPLE_API_ISSUER_ID"             --wait

          xcrun stapler staple Function.app
          xcrun stapler staple Function.dmg

          xcrun stapler validate Function.app
          xcrun stapler validate Function.dmg

          spctl --assess --type execute --verbose=4 Function.app
          spctl --assess --type open --context context:primary-signature --verbose=4 Function.dmg

      - name: Verify unsigned development artifact
        if: env.SIGNED != 'true'
        run: |
          codesign --verify --deep --strict --verbose=2 Function.app

      - name: Archive packaged app
        run: ditto -c -k --keepParent Function.app "Function-${APP_VERSION}.app.zip"

      - name: Upload Function.app
        uses: actions/upload-artifact@v5
        with:
          name: Function-macOS-${{ env.APP_VERSION }}
          path: Function-${{ env.APP_VERSION }}.app.zip
          if-no-files-found: error

      - name: Upload Function.dmg
        uses: actions/upload-artifact@v5
        with:
          name: Function-DMG-${{ env.APP_VERSION }}
          path: Function.dmg
          if-no-files-found: error

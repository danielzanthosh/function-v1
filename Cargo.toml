[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/ui",
    "crates/agent",
    "crates/memory",
    "crates/tools",
    "crates/providers",
    "crates/platform",
    "crates/config",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = []
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["sync", "rt", "rt-multi-thread", "macros"] }
async-trait = "0.1"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.18.2"
hound = "3.5.1"
pulldown-cmark = "0.12"

# Internal workspace crates
function-app = { path = "crates/app" }
function-ui = { path = "crates/ui" }
function-agent = { path = "crates/agent" }
function-memory = { path = "crates/memory" }
function-tools = { path = "crates/tools" }
function-providers = { path = "crates/providers" }
function-platform = { path = "crates/platform" }
function-config = { path = "crates/config" }
